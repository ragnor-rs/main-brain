backend.CHOOSE_A_DRAFT=Вот варианты ответа. Выберите подходящий и отправьте сами.
backend.SUBJECT_AMBIGUOUS=Уточните, что имеется в виду:
backend.SUBJECT_INDISTINGUISHABLE=Под этот запрос подходит несколько разных записей с одинаковыми именами, и выбрать одну из них по имени не получится. Попробуйте спросить иначе: полным названием или другим именем.
backend.SUBJECT_MISSING=Для ответа нужно имя, а в запросе его нет. Назовите человека — в команде имя идёт после неё. Если имя носит не один человек, укажите имя пользователя через @.
backend.SUBJECT_NOT_FOUND=Ничего подходящего не нашлось.
backend.SUBJECT_NEAREST_NAMES=Точного совпадения не нашлось.
backend.SUBJECT_NOT_READ=Не удалось понять, о ком или о чём вопрос. Повторите его, назвав человека, компанию или переписку, — или воспользуйтесь командой с именем после неё. Сводка по всем входящим — <b>/status</b> без имени.
backend.NOTHING_TO_ANSWER_FROM=В материалах нет того, на чём можно построить ответ. Лучше не отвечать, чем ответить наугад.
backend.ANSWER_UNREADABLE=Ответ был готов, но разобрать его не удалось. Это сбой на моей стороне, а не нехватка материалов. Спросите, пожалуйста, ещё раз.
backend.REQUEST_MALFORMED=Не понял запрос. Напишите вопрос текстом или используйте команду — <b>/help</b> покажет список.
backend.REQUEST_UNAUTHORISED=Доступ к сервису не подтверждён. Это ошибка настройки, а не ваших прав.
backend.CANNOT_ANSWER_RIGHT_NOW=Сейчас ответить не получится: сервис недоступен. Попробуйте чуть позже.
backend.UNEXPECTED_FAILURE=Что-то пошло не так. Подробности — в журнале сервиса.

# --- What this interface says ---------------------------------------------------------------

bot.HELP=Помогаю разобраться в переписке. Мои материалы — ваша переписка в Telegram. Напишите вопрос обычным текстом или используйте команду:\n\
<b>/status</b> — что происходит (контакт, клиент, проект целиком, переписка, входящие)\n\
<b>/draft</b> — варианты ответа контакту\n\
<b>/prepare</b> — подготовка к звонку с контактом\n\
<b>/research</b> — вопрос с поиском в интернете и ссылками на источники\n\
<b>/help</b>, <b>/start</b> — это сообщение\n\
\n\
После /status, /draft и /prepare можно указать имя: /status Название компании\n\
Если имя носит не один человек, спросите по имени пользователя: /status @имя\n\
Без имени /status покажет сводку по входящим.\n\
После /research пишите не имя, а сам вопрос: /research рынок логистики в Грузии\n\
\n\
Ничего не отправляю от вашего имени — отправляете всегда вы сами. Варианты из /draft нужно отправить самостоятельно; остальное я показываю только вам.

bot.UNKNOWN_COMMAND=Такой команды у меня нет.\n\n{0}
bot.ANSWER_OVERRAN=Ответ готовился дольше, чем я жду, и я перестал ждать. Сервис при этом отвечал: запрос не отклонён, он просто не успел. Повтор может занять столько же — надёжнее сузить вопрос и спросить конкретнее.

