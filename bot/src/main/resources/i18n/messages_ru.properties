# The only place display text exists in this process.
#
# Russian is this interface's floor: every key of both enums resolves here, which `Catalogue`
# checks when it is built rather than when a key is read — so a hole stops the process at startup
# instead of reaching somebody as a code. A further locale may be partial and falls back here per
# key, which makes a missing translation look like one untranslated line.
#
# Read as UTF-8, explicitly, by the loader. `{0}` and so on are filled positionally by literal
# substitution; nothing here is passed through MessageFormat, so an apostrophe is an apostrophe.
#
# Keys are namespaced by who says the thing. `backend.*` is the wire format's MessageKey — what
# the service says about itself, which every interface receives. `bot.*` is this interface's own
# furniture, which the backend has never heard of.
#
# An entry may carry the platform's markup, and `Catalogue` refuses a bundle it would not render as
# written. What it refuses: a tag this interface does not declare, a tag left open, a closer with
# nothing to close, emphasis inside emphasis, and one of `<`, `>`, `&` standing as itself rather
# than as `&lt;`, `&gt;`, `&amp;`.
#
# Why each matters is worth knowing, because the failures differ. Markup the platform cannot parse
# means the message is not delivered at all, and the failed send drops whatever was queued behind
# it. An `&` that begins no entity is accepted with the text quietly altered — `&lt` reaches a
# reader as `<`. And an undeclared or nested tag is accepted by the platform but cannot be closed
# when a long reply is cut into pieces, so it is delivered until a reply using it grows past the
# message limit and then is not delivered at all.
#
# So the tags available here are the ones this interface declares, and no others — adding one is a
# change to that declaration rather than to this file.
#
# What an entry here emphasises is the token the reader answers with, and nothing else — the
# command in the list, the command a refusal points them at, the name they would say back to
# choose a menu option. On a menu that is whichever token tells one option from another: where two
# candidates share a display name, the name is the one thing that cannot be answered with, and the
# handle is what names one of them. A text with everything emphasised has no emphasis, so a
# translator adding more is removing some.
#
# The interface also sets off whole lines of its own — a section's heading, the block saying what
# a reply rests on — which is a decision about where emphasis falls rather than about wording, and
# is taken in code. It is why nothing here may nest emphasis: an entry wrapped in emphasis by the
# interface and carrying its own would leave two elements open where a long reply is cut, and the
# message would not arrive at all.

