# A bundle with a misspelled name in it, which is how a translation silently fails to apply: the
# entry is present, nothing ever asks for it, and the locale reads as translated while rendering
# the floor's words. Loaded beside a complete floor, so what fails is the unknown entry and not
# any missing one.

bot.VARIANT=Option {0}
bot.VARIANTT=Optionn {0}
