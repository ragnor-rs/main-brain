# A locale the platform would not render as written, for the check that catches it.
#
# One entry per fault class, which is what lets the refusal be held to reporting all of them
# rather than the first: a tag left open, a tag outside the vocabulary this interface declares,
# emphasis inside emphasis, a reserved character standing as itself, and a closer with nothing to
# close. Not every one of these is a message the platform refuses — the ampersand it accepts and
# quietly alters instead — so what this fixture holds is faults, not refusals.
#
# The out-of-vocabulary entry uses a tag no interface here will ever render, deliberately. A tag
# the platform itself supports would stop being a fault the moment this build adopted it, and the
# case would then pass while asserting nothing.
#
# Real key names throughout, so what fires is the markup check and not the one that refuses an
# entry nothing asks for. Latin text for the reason the partial locale beside this gives.
#
# Nothing loads this but `CatalogueTest`. A locale this broken would stop the process at startup,
# which is the whole point of it.

bot.VARIANT=Option <b>{0}
bot.KIND_CONTACT=a <blink>contact</blink>
bot.KIND_CLIENT=Acme & Co.
bot.KIND_CONVERSATION=a <b>thread <b>within</b> a thread</b>
bot.SUBJECT_NAMED=Looked for {0}</b>
