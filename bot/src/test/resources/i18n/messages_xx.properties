# A deliberately partial locale, for the fallback this build ships no second locale to exercise.
#
# Four entries out of the whole key set, so every other key has to fall back to the floor. The
# text is Latin so that a test can assert on it literally — a test asserting Russian would put
# display text in Kotlin source, which is the thing the rules forbid.
#
# `SUBJECT_NAMED` carries an apostrophe on purpose: MessageFormat would read it as an escape and
# drop part of the sentence, so this is what proves the substitution here is literal.
#
# `UNKNOWN_COMMAND` is translated and the command list it takes is not, deliberately: that is the
# one entry filled with another, so it is what shows the argument resolving per key — this locale's
# sentence around the floor's list, which is the fallback working rather than a reply half
# translated by accident.

bot.VARIANT=Option {0}
bot.SUBJECT_NAMED=It's {0}, isn't it
bot.UNKNOWN_COMMAND=No such command.\n\n{0}
backend.CHOOSE_A_DRAFT=Pick one.
